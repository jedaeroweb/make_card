        one: 일 분 이하
        other: ! '%{count}분 이하'
      less_than_x_seconds:
        one: 일 초 이하
        other: ! '%{count}초 이하'
      over_x_years:
        one: 일 년 이상
        other: ! '%{count}년 이상'
      x_days:
